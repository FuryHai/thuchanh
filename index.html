<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Quản Lý Món Ăn</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f9f9f9;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .table-container {
            width: 100%;
            max-width: 900px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            padding: 24px;
        }

        .table-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #f8f9fa;
            color: #555;
            font-weight: 600;
            font-size: 14px;
            padding: 14px 16px;
            border-bottom: 2px solid #eaeaea;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid #f0f0f0;
            color: #333;
            font-size: 14px;
            vertical-align: middle;
        }

        tr:hover {
            background-color: #fcfcfc;
        }

        /* Định dạng cột hình ảnh/emoji */
        .food-icon {
            font-size: 24px;
            background: #fff5f5;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }

        /* Nhãn trạng thái HOT */
        .badge-hot {
            background-color: #ff3b30;
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 8px;
            text-transform: uppercase;
        }

        /* Định dạng giá tiền */
        .price {
            font-weight: 600;
            color: #ff3b30;
        }

        /* Định dạng đánh giá */
        .rating {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .star {
            color: #ffcc00;
        }

        .review-count {
            color: #888;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="table-container">
    <div class="table-title">📋 Danh Sách Món Ngon Phổ Biến</div>
    
    <table>
        <thead>
            <tr>
                <th style="width: 10%;">Hình ảnh</th>
                <th style="width: 35%;">Tên món ăn</th>
                <th style="width: 25%;">Giá bán</th>
                <th style="width: 30%;">Đánh giá</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><div class="food-icon">🍔</div></td>
                <td><strong>Burger Bò Phô Mai</strong><span class="badge-hot">Hot</span></td>
                <td><span class="price">45.000đ</span></td>
                <td>
                    <div class="rating">
                        <span class="star">★</span> <span>4.8</span> <span class="review-count">(120 lượt)</span>
                    </div>
                </td>
            </tr>
            <tr>
                <td><div class="food-icon">🍟</div></td>
                <td><strong>Khoai Tây Chiên</strong></td>
                <td><span class="price">25.000đ</span></td>
                <td>
                    <div class="rating">
                        <span class="star">★</span> <span>4.7</span> <span class="review-count">(96 lượt)</span>
                    </div>
                </td>
            </tr>
            <tr>
                <td><div class="food-icon">🍗</div></td>
                <td><strong>Gà Rán Truyền Thống</strong></td>
                <td><span class="price">35.000đ</span></td>
                <td>
                    <div class="rating">
                        <span class="star">★</span> <span>4.9</span> <span class="review-count">(150 lượt)</span>
                    </div>
                </td>
            </tr>
            <tr>
                <td><div class="food-icon">🍕</div></td>
                <td><strong>Pizza Hải Sản</strong></td>
                <td><span class="price">89.000đ</span></td>
                <td>
                    <div class="rating">
                        <span class="star">★</span> <span>4.6</span> <span class="review-count">(75 lượt)</span>
                    </div>
                </td>
            </tr>
            <tr>
                <td><div class="food-icon">🥤</div></td>
                <td><strong>Coca Cola</strong></td>
                <td><span class="price">15.000đ</span></td>
                <td>
                    <div class="rating">
                        <span class="star">★</span> <span>4.7</span> <span class="review-count">(60 lượt)</span>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
