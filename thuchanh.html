<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành Bảng Điểm</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding: 20px;
        }
        table {
            border-collapse: collapse;
            background-color: #ffffff;
            font-size: 14px;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        th, td {
            border: 1px solid #333333;
            padding: 10px 15px;
            text-align: left;
        }
        th {
            background-color: #ffffff;
            color: #0000ff;
            text-align: center;
            font-weight: bold;
        }
        .text-center {
            text-align: center;
        }
        .bg-highlight {
            background-color: #ffffe0;
            font-weight: bold;
            color: #008000; /* Thêm màu xanh cho chữ Đạt */
        }
        .bold-text {
            font-weight: bold;
            color: #ff0000; /* Thêm màu đỏ cho chữ Không Đạt */
        }
    </style>
</head>
<body>

    <table>
        <thead>
            <tr>
                <th rowspan="2">Họ tên</th>
                <th colspan="2">Điểm</th>
                <th rowspan="2">Ghi chú</th>
            </tr>
            <tr>
                <th>Lý thuyết</th>
                <th>Thực hành</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Nguyễn Văn A</td>
                <td class="text-center">8.0</td>
                <td class="text-center">9.0</td>
                <td rowspan="2" class="text-center bg-highlight">Đạt</td>
            </tr>
            <tr>
                <td>Trần Thị B</td>
                <td class="text-center">7.5</td>
                <td class="text-center">8.0</td>
            </tr>
            <tr>
                <td>Lê Văn C</td>
                <td class="text-center">5.0</td>
                <td class="text-center">4.0</td>
                <td class="text-center bold-text">Không Đạt</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
